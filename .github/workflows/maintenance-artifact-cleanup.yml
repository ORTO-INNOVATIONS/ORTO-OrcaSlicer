name: Remove superseded Actions artifact
on:
  push:
    branches: [maintenance/cleanup-artifacts-20261128]
    paths: ['.github/workflows/maintenance-artifact-cleanup.yml']
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Delete only verified superseded artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'}
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/14959909985"
          $a = Invoke-RestMethod -Uri $uri -Headers $headers
          if ($a.id -ne 14959909985 -or $a.name -cne 'ORTO-OrcaSlicer-Quick-Windows-x64-2.6.0-ORTO.22-11bcd05352cb6b7186d4bf9e3f497b4d554b9c73' -or $a.size_in_bytes -ne 198944844) { throw 'Artifact identity mismatch; no deletion' }
          Write-Host "Deleting $($a.name), $($a.size_in_bytes) bytes"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Delete
          if ($response.StatusCode -ne 204) { throw "Unexpected status $($response.StatusCode)" }
          Write-Host "Deleted artifact $($a.id): $($a.size_in_bytes) bytes"
