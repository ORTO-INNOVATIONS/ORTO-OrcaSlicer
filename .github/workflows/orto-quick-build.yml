name: ORTO Quick Build

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: 'Force rebuild dependencies'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      force-build:
        description: 'Force rebuild dependencies'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Keep one writer for the mutable incremental build cache.
concurrency:
  group: orto-quick-build-windows-x64
  cancel-in-progress: false

jobs:
  quick-build:
    name: Incremental Windows x64 (Clang + Ninja)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    env:
      BUILD_DIR: build
      DEPS_DIR: deps/build
      BUILD_CACHE_KEY: orto-quick-build-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # The runner has Git for Windows tar.exe but no gzip.exe. Install a
      # standalone gzip alongside tar and expose it to all action steps.
      # Git's tar invokes gzip via sh, so changing PATH to System32 alone
      # is not sufficient on this self-hosted machine.
      - name: Ensure gzip is available for actions cache
        shell: pwsh
        run: |
          $gzip = Get-Command gzip.exe -ErrorAction SilentlyContinue
          if (-not $gzip) {
            $candidates = @(
              'C:\Strawberry\c\bin\gzip.exe',
              'C:\Program Files\Git\mingw64\bin\gzip.exe',
              'C:\Program Files\Git\usr\bin\gzip.exe'
            )
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $dir = Split-Path $candidate -Parent
                "$dir" >> $env:GITHUB_PATH
                $env:PATH = "$dir;$env:PATH"
                $gzip = Get-Command gzip.exe -ErrorAction SilentlyContinue
                break
              }
            }
          }
          if (-not $gzip) {
            throw 'gzip.exe is missing on the runner. Install Git for Windows with gzip, or Strawberry Perl including gzip, and restart the runner.'
          }
          & $gzip.Source --version

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Compute dependency cache key
        id: deps-key
        shell: pwsh
        run: |
          $depsTree = git rev-parse "${{ github.sha }}:deps"
          "key=windows-x64-clang-cache-orcaslicer_deps-build-$depsTree" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        id: deps-cache
        if: ${{ !inputs.force-build }}
        uses: actions/cache/restore@v6
        with:
          path: deps/build/OrcaSlicer_dep
          # Prefer this workflow's fast Git-tree key; fall back to any existing full-build deps cache.
          key: ${{ steps.deps-key.outputs.key }}
          restore-keys: |
            windows-x64-clang-cache-orcaslicer_deps-build-
          fail-on-cache-miss: false

      - name: Restore incremental build tree
        id: build-cache
        if: ${{ !inputs.force-build }}
        uses: actions/cache/restore@v6
        with:
          path: build
          key: ${{ env.BUILD_CACHE_KEY }}
          restore-keys: |
            orto-quick-build-windows-x64-

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Setup MSBuild environment
        uses: microsoft/setup-msbuild@v3

      - name: Build dependencies on cache miss
        if: inputs.force-build || steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host 'Dependency cache miss. Validating Strawberry Perl before compiling dependencies.'
          # Git for Windows bundles an MSYS Perl ahead of Strawberry Perl in PATH.
          # OpenSSL Configure needs standard Perl modules absent in that MSYS build.
          $strawberryPerl = 'C:\Strawberry\perl\bin'
          $strawberryExe = Join-Path $strawberryPerl 'perl.exe'
          if (-not (Test-Path $strawberryExe)) {
            throw "Strawberry Perl was not found at $strawberryExe. Install Strawberry Perl on PAPUS."
          }
          # Do not rely on Get-Command perl.exe: Git for Windows may win PATH.
          # Set PATH only for this step; all OpenSSL subprocesses inherit it.
          $env:PATH = "$strawberryPerl;$env:PATH"
          $env:PERL5LIB = ''
          $env:PERL5OPT = ''
          $env:PERLLIB = ''
          & $strawberryExe -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "Strawberry Perl modules OK\\n"'
          if ($LASTEXITCODE -ne 0) {
            throw 'Strawberry Perl lacks required OpenSSL Configure modules.'
          }
          $resolvedPerl = (Get-Command perl.exe -ErrorAction Stop).Source
          if ($resolvedPerl -ine $strawberryExe) {
            throw "Wrong Perl selected: $resolvedPerl; expected $strawberryExe"
          }
          Write-Host "Using Perl: $resolvedPerl"
          & .\build_win.bat -d --arch x64 --deps-dir $env:DEPS_DIR -l -x
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency build failed with exit code $LASTEXITCODE."
          }

      - name: Save dependency cache
        if: ${{ !inputs.force-build && steps.deps-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@v6
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps-key.outputs.key }}

      - name: Configure and build OrcaSlicer
        shell: pwsh
        run: |
          $buildArgs = @(
            '-s', '-i',
            '--arch', 'x64',
            '--build-dir', $env:BUILD_DIR,
            '--deps-dir', $env:DEPS_DIR,
            '-l', '-x',
            '--slicer-target', 'OrcaSlicer_app_gui',
            '--no-gettext'
          )

          # Refresh the CMake graph on every run so changes to CMakeLists.txt,
          # target names and output names are applied to a restored Ninja tree.
          # Ninja still recompiles only sources whose dependencies changed.
          if ("${{ steps.build-cache.outputs.cache-hit }}" -eq 'true') {
            Write-Host 'Restored incremental build tree; refreshing CMake and compiling changed targets.'
          } else {
            Write-Host 'No incremental build tree found; performing the initial configure and build.'
          }

          & .\build_win.bat @buildArgs
          if ($LASTEXITCODE -ne 0) {
            throw "OrcaSlicer quick build failed with exit code $LASTEXITCODE."
          }

      - name: Read ORTO version
        id: orto-version
        shell: pwsh
        run: |
          $match = Select-String -Path version.inc -Pattern 'set\(SoftFever_VERSION "([^"]+)"\)' | Select-Object -First 1
          if (-not $match) { throw 'SoftFever_VERSION not found' }
          "value=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Upload portable OrcaSlicer
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ORTO-OrcaSlicer-Quick-Windows-x64-${{ steps.orto-version.outputs.value }}-${{ github.sha }}
          path: build/OrcaSlicer
          if-no-files-found: error
          retention-days: 7

      # Save the Ninja graph and object files even after a compiler failure:
      # the next run can reuse everything that was built successfully.
      - name: Save incremental build tree
        if: always() && (steps.build-cache.outcome == 'success' || inputs.force-build)
        uses: actions/cache/save@v6
        with:
          path: build
          key: ${{ env.BUILD_CACHE_KEY }}
