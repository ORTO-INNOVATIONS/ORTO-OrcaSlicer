name: Publish ORTO Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful ORTO Windows Portable Build run ID (optional; auto-detected by commit SHA)'
        required: false
        type: string
      source_sha:
        description: 'Commit SHA of the already-built source (optional; defaults to the selected ref)'
        required: false
        type: string
      tag:
        description: 'Release tag (must match version.inc; stable release)'
        required: true
        type: string
        default: v2.6.0-ORTO.20

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish Windows Portable release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || '' }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      TRIGGER_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          lfs: false

      - name: Validate source build and publish release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TRIGGER_REF" == refs/heads/* && "$TRIGGER_REF" != "refs/heads/orto-dev" ]]; then
            echo "::error::Releases can only be dispatched from orto-dev."
            exit 1
          fi

          version=$(awk -F '"' '/SoftFever_VERSION/ { print $2; exit }' version.inc)
          if [[ -z "$version" ]]; then
            echo "::error::Could not read SoftFever_VERSION from version.inc."
            exit 1
          fi

          expected_tag="v$version"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "::error::Tag $TAG does not match version.inc ($expected_tag)."
            exit 1
          fi

          release_sha=$(git rev-parse HEAD)
          if [[ -n "$SOURCE_SHA" && "$release_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked out commit $release_sha does not match requested source SHA $SOURCE_SHA."
            exit 1
          fi
          run_id="$RUN_ID"

          if [[ -z "$run_id" ]]; then
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow orto-windows-build.yml \
              --branch orto-dev \
              --status success \
              --limit 100 \
              --json databaseId,headSha,headBranch,workflowName \
              | jq -r --arg sha "$release_sha" '
                  [.[] | select(
                    .headSha == $sha and
                    .headBranch == "orto-dev" and
                    .workflowName == "ORTO Windows Portable Build"
                  )][0].databaseId // empty
                ')
          fi

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful ORTO Windows Portable Build was found for commit $release_sha."
            exit 1
          fi

          run=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,headSha,workflowName)
          conclusion=$(jq -r '.conclusion // empty' <<< "$run")
          branch=$(jq -r '.headBranch // empty' <<< "$run")
          workflow=$(jq -r '.workflowName // empty' <<< "$run")
          build_sha=$(jq -r '.headSha // empty' <<< "$run")

          echo "Release commit: $release_sha"
          echo "Source build: run $run_id; workflow=$workflow; branch=$branch; conclusion=$conclusion; SHA=$build_sha"

          if [[ "$conclusion" != "success" ||
                "$branch" != "orto-dev" ||
                "$build_sha" != "$release_sha" ||
                "$workflow" != "ORTO Windows Portable Build" ]]; then
            echo "::error::Release requires a successful ORTO Windows Portable Build for this exact orto-dev commit."
            exit 1
          fi

          artifact_name="ORTO-OrcaSlicer-Quick-Windows-x64-$release_sha"
          mkdir -p artifacts upload
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir artifacts

          artifact_file=$(find artifacts -type f -print -quit)
          if [[ -z "$artifact_file" ]]; then
            echo "::error::The expected portable artifact '$artifact_name' is empty or unavailable."
            exit 1
          fi

          asset_name="ORTO-OrcaSlicer-Windows-x64-Portable-$version.zip"
          asset_path="$GITHUB_WORKSPACE/upload/$asset_name"
          (cd artifacts && zip -q -r -0 "$asset_path" .)
          test -s "$asset_path"

          cat > release-notes.md <<EOF
          # ORTO OrcaSlicer $version RELEASE

          Специализированная сборка OrcaSlicer для интеграции с производственной экосистемой ORTO.

          ## Что входит
          - Автоматизированная подготовка косметических оболочек протезов для производственного процесса ORTO.
          - Поворот модели на +90° вокруг оси X.
          - Отдельная настройка подъёма модели над столом во вкладке Preferences → ORTO (по умолчанию 3 мм).
          - Отдельная настройка положения Support Blocker во вкладке Preferences → ORTO (по умолчанию 20 мм).
          - Значения подъёма модели и Support Blocker сохраняются в настройках и применяются при подготовке; они не зашиты как фиксированные величины.
          - Загрузка профилей принтера, процесса и филамента из JSON.
          - Production GUI: оператор вручную запускает Slice и подтверждает готовый G-code.
          - Headless Production: CLI выполняет Cosmetic Shell и слайсинг один раз, создаёт prepared G-code и sidecar-манифест с SHA-256 и профилями.
          - Production Review: STL Distributor запускает просмотр подготовленного G-code; оператор подтверждает именно открытый файл без повторной нарезки.
          - Headless CLI проверен с внешними JSON-профилями принтера, процесса и филамента Elegoo.
          - Неподтверждённый prepared G-code не передаётся в производственную очередь; downstream получает только approved G-code и manifest.
          - Folder Helper используется как локальный мост запуска Headless из ORTO Docs, но не оркестрирует Production Review.

          ## Формат распространения
          Только Windows x64 Portable. Установщик не предоставляется.

          ## Установка
          Распакуйте архив в отдельный каталог и укажите путь к `orto-orca-slicer.exe` в настройках интеграции ORTO.

          ## Источник бинарников
          Артефакт из успешной ORTO Windows Portable Build для commit `$release_sha` (run `$run_id`). Повторная компиляция при публикации не выполняется.
          EOF

          release_title="ORTO OrcaSlicer $version RELEASE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its notes and attaching the verified build."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$asset_path" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$asset_path" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes-file release-notes.md \
              --target "$release_sha" \
              --latest
          fi

          echo "Published $TAG using verified build run $run_id ($release_sha)."
