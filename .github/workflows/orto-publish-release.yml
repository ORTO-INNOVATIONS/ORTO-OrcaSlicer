          - Автоматизированная подготовка косметических оболочек протезов для производственного процесса ORTO.
          - Поворот модели на +90° вокруг оси X.
          - Отдельная настройка подъёма модели над столом во вкладке Preferences → ORTO (по умолчанию 3 мм).
          - Отдельная настройка положения Support Blocker во вкладке Preferences → ORTO (по умолчанию 20 мм).
          - Значения подъёма модели и Support Blocker сохраняются в настройках и применяются при подготовке; они не зашиты как фиксированные величины.
