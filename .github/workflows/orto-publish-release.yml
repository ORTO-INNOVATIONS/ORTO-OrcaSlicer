name: Publish ORTO Portable Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful ORTO Windows Portable Build run ID'
        required: true
        type: string
      tag:
        description: 'Release tag (must match version.inc; stable release)'
        required: true
        type: string
        default: v2.6.0-ORTO.20

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish Windows Portable release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release documentation
        uses: actions/checkout@v7
        with:
          ref: orto-dev
          lfs: false

      - name: Validate version and source build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*set(SoftFever_VERSION "\(.*\)").*/\1/p' version.inc)
          expected_tag="v$version"
          if [ "$TAG" != "$expected_tag" ]; then
            echo "::error::Tag $TAG does not match version.inc ($expected_tag)."
            exit 1
          fi
          run=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headBranch,headSha,workflowName)
          conclusion=$(jq -r '.conclusion' <<< "$run")
          branch=$(jq -r '.headBranch' <<< "$run")
          workflow=$(jq -r '.workflowName' <<< "$run")
          target_sha=$(jq -r '.headSha' <<< "$run")
          echo "Source workflow: $workflow; branch: $branch; conclusion: $conclusion; build SHA: $target_sha"
          if [ "$conclusion" != success ] || [ "$branch" != orto-dev ] || { [ "$workflow" != "ORTO Windows Portable Build" ] && [ "$workflow" != "ORTO Quick Build" ]; }; then
            echo "::error::Source run must be successful and belong to orto-dev."
            exit 1
          fi

          # The release tag may include documentation/workflow metadata committed
          # after the verified build, but no source/build inputs may differ.
          release_sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$target_sha" "$release_sha"; then
            echo "::error::The successful build commit is not an ancestor of the release checkout."
            exit 1
          fi
          unexpected=$(git diff --name-only "$target_sha" "$release_sha" | grep -Ev '^(README\.md|CHANGELOG\.md|VERSION\.txt|docs/ORTO_PRODUCTION_MODE\.md|\.github/workflows/orto-publish-release\.yml|\.github/workflows/orto-windows-build\.yml)
      - name: Download portable artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts upload
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          find artifacts -maxdepth 2 -type f -print
          if [ ! -d artifacts ]; then
            echo "::error::No artifact directory was downloaded."
            exit 1
          fi
          artifact_dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$artifact_dir" ]; then
            echo "::error::Portable artifact folder was not found."
            exit 1
          fi
          (cd "$artifact_dir" && zip -qr "$GITHUB_WORKSPACE/upload/ORTO-OrcaSlicer-Windows-x64-Portable-$VERSION.zip" .)
          test -s "upload/ORTO-OrcaSlicer-Windows-x64-Portable-$VERSION.zip"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # ORTO OrcaSlicer $VERSION

          Специализированная сборка OrcaSlicer для интеграции с производственной экосистемой ORTO.

          ## Что входит
          - Автоматизированная подготовка косметических оболочек протезов для производственного процесса ORTO.
          - Поворот модели на +90° вокруг оси X.
          - Отдельная настройка подъёма модели над столом во вкладке Preferences → ORTO (по умолчанию 3 мм).
          - Отдельная настройка положения Support Blocker во вкладке Preferences → ORTO (по умолчанию 20 мм).
          - Значения подъёма модели и Support Blocker сохраняются в настройках и применяются при подготовке; они не зашиты как фиксированные величины.
          - Загрузка профилей принтера, процесса и филамента из JSON.
          - Production GUI: оператор вручную запускает Slice и подтверждает готовый G-code.
          - Headless Production: CLI выполняет Cosmetic Shell и слайсинг один раз, создаёт prepared G-code и sidecar-манифест с SHA-256 и профилями.
          - Production Review: STL Distributor запускает просмотр подготовленного G-code; оператор подтверждает именно открытый файл без повторной нарезки.
          - Headless CLI проверен с внешними JSON-профилями принтера, процесса и филамента Elegoo.
          - Неподтверждённый prepared G-code не передаётся в производственную очередь; downstream получает только approved G-code и manifest.
          - Folder Helper используется как локальный мост запуска Headless из ORTO Docs, но не оркестрирует Production Review.

          ## Формат распространения
          Только Windows x64 Portable. Установщик не предоставляется.

          ## Установка
          Распакуйте архив в отдельный каталог и укажите путь к `orto-orca-slicer.exe` в настройках интеграции ORTO.
          EOF
          gh release create "$TAG" "upload/ORTO-OrcaSlicer-Windows-x64-Portable-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORTO OrcaSlicer $VERSION" \
            --notes-file release-notes.md \
            --target "$TARGET_SHA"
 || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Code/build inputs changed after the source build:"
            printf '%s\\n' "$unexpected"
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "Release tag target: $release_sha (verified binary source: $target_sha)"

      - name: Download portable artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts upload
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          find artifacts -maxdepth 2 -type f -print
          if [ ! -d artifacts ]; then
            echo "::error::No artifact directory was downloaded."
            exit 1
          fi
          artifact_dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$artifact_dir" ]; then
            echo "::error::Portable artifact folder was not found."
            exit 1
          fi
          (cd "$artifact_dir" && zip -qr "$GITHUB_WORKSPACE/upload/ORTO-OrcaSlicer-Windows-x64-Portable-$VERSION.zip" .)
          test -s "upload/ORTO-OrcaSlicer-Windows-x64-Portable-$VERSION.zip"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # ORTO OrcaSlicer $VERSION

          Специализированная сборка OrcaSlicer для интеграции с производственной экосистемой ORTO.

          ## Что входит
          - Автоматизированная подготовка косметических оболочек протезов для производственного процесса ORTO.
          - Поворот модели на +90° вокруг оси X.
          - Отдельная настройка подъёма модели над столом во вкладке Preferences → ORTO (по умолчанию 3 мм).
          - Отдельная настройка положения Support Blocker во вкладке Preferences → ORTO (по умолчанию 20 мм).
          - Значения подъёма модели и Support Blocker сохраняются в настройках и применяются при подготовке; они не зашиты как фиксированные величины.
          - Загрузка профилей принтера, процесса и филамента из JSON.
          - Production GUI: оператор вручную запускает Slice и подтверждает готовый G-code.
          - Headless Production: CLI выполняет Cosmetic Shell и слайсинг один раз, создаёт prepared G-code и sidecar-манифест с SHA-256 и профилями.
          - Production Review: STL Distributor запускает просмотр подготовленного G-code; оператор подтверждает именно открытый файл без повторной нарезки.
          - Headless CLI проверен с внешними JSON-профилями принтера, процесса и филамента Elegoo.
          - Неподтверждённый prepared G-code не передаётся в производственную очередь; downstream получает только approved G-code и manifest.
          - Folder Helper используется как локальный мост запуска Headless из ORTO Docs, но не оркестрирует Production Review.

          ## Формат распространения
          Только Windows x64 Portable. Установщик не предоставляется.

          ## Установка
          Распакуйте архив в отдельный каталог и укажите путь к `orto-orca-slicer.exe` в настройках интеграции ORTO.
          EOF
          gh release create "$TAG" "upload/ORTO-OrcaSlicer-Windows-x64-Portable-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORTO OrcaSlicer $VERSION" \
            --notes-file release-notes.md \
            --target "$TARGET_SHA"
