name: ORTO Windows Build

on:
  push:
    branches:
      - orto-dev
    paths:
      - 'src/**'
      - 'libslic3r/**'
      - 'slic3r/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - '.github/workflows/orto-windows-build.yml'
      - '.github/workflows/build_*.yml'
      - 'build_win.bat'
      - 'scripts/msix/**'
  workflow_dispatch:
    inputs:
      force-build:
        description: 'Force rebuild dependencies'
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: read

# Only the newest Windows build for this branch is useful.
# Unlike Quick Build, this workflow does not share a mutable incremental
# build directory, so cancelling an obsolete run cannot corrupt that cache.
concurrency:
  group: orto-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows_x64:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      force-build: ${{ inputs.force-build || false }}
    secrets: inherit
