name: ORTO Windows Build

on:
  push:
    branches:
      - orto-dev
    paths:
      - 'src/**'
      - 'libslic3r/**'
      - 'slic3r/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - '.github/workflows/orto-windows-build.yml'
      - '.github/workflows/build_*.yml'
      - 'build_win.bat'
  workflow_dispatch:
    inputs:
      force-build:
        description: 'Force rebuild dependencies'
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: read

jobs:
  build_windows_x64:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      force-build: ${{ inputs.force-build || false }}
    secrets: inherit
