name: ORTO Windows Portable Build

on:
  push:
    branches:
      - orto-dev
    paths:
      - 'src/**'
      - 'libslic3r/**'
      - 'slic3r/**'
      - '**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'version.inc'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/ORTO_PRODUCTION_MODE.md'
      - '.github/workflows/orto-publish-release.yml'
      - '.github/workflows/orto-windows-build.yml'
      - '.github/workflows/orto-quick-build.yml'
      - 'build_win.bat'
  workflow_dispatch:
    inputs:
      force-build:
        description: 'Force rebuild dependencies'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# ORTO distributes only the Windows Portable build. Reuse the tested
# incremental pipeline; do not invoke the upstream installer/CPack workflow.
jobs:
  portable:
    name: Build ORTO Windows Portable
    uses: ./.github/workflows/orto-quick-build.yml
    with:
      force-build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force-build == 'true' }}
    secrets: inherit
